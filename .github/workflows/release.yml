name: Release
on:
  push:
    tags: ['*/*']

permissions:
  contents: read
  # The release notes are written from the pull requests behind the release.
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve library from tag
        id: lib
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          LIB="${TAG%%/*}"
          # The name has to be checked before the path: 'libs/../bin' is an existing directory, so a
          # tag like '../1.0.0' would otherwise look like a library.
          if ! printf '%s' "${LIB}" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*$' || [ ! -d "libs/${LIB}" ]; then
            echo "::notice::Tag '${TAG}' does not map to a library directory; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Build and dev tags share the '<lib>/<something>' shape but are not releases, so they are
          # published to the standalone repo without a GitHub release being created for them.
          if ! printf '%s' "${TAG}" | grep -qE "^${LIB}/[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "::notice::Tag '${TAG}' is not a version tag; publishing it without a release."
            echo "skip-release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "library=${LIB}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*/}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/split-library
        if: steps.lib.outputs.skip != 'true'
        with:
          library: ${{ steps.lib.outputs.library }}
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/create-release
        if: steps.lib.outputs.skip != 'true' && steps.lib.outputs.skip-release != 'true'
        with:
          library: ${{ steps.lib.outputs.library }}
          version: ${{ steps.lib.outputs.version }}
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.RELEASE_GENERATOR_GEMINI_API_KEY }}
          model: ${{ vars.RELEASE_GENERATOR_GEMINI_MODEL }}
