name: Create release
description: Write release notes with Gemini and create a GitHub release in the library's standalone repo

# Credentials stay inputs, never job-level env, so the App private key reaches only the token step.
inputs:
  library:
    description: Library directory name under libs/ (e.g. output-mapping)
    required: true
  version:
    description: Released version, without the library prefix (e.g. 27.10.0)
    required: true
  app-id:
    description: GitHub App ID used to mint a scoped installation token
    required: true
  private-key:
    description: GitHub App private key (PEM) used to mint a scoped installation token
    required: true
  gemini-api-key:
    description: Gemini API key used to write the release notes
    required: true
  model:
    description: Gemini model that writes the notes (no default — model IDs go stale, so it is
      configured in the RELEASE_GENERATOR_GEMINI_MODEL repository variable)
    required: true
  dry-run:
    description: Print the notes to the job summary instead of creating the release
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The library -> standalone repo mapping lives in bin/target-repo.sh, shared with split-library.
    - name: Resolve target repository
      id: target
      shell: bash
      env:
        LIBRARY: ${{ inputs.library }}
      run: |
        # Assigned, not echoed inline, so a rejected library name fails the step.
        REPO="$("${{ github.workspace }}/bin/target-repo.sh" "${LIBRARY}")"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: keboola
        repositories: ${{ steps.target.outputs.repo }}

    # Makes both callers re-runnable: a release that is already there is never rewritten.
    - name: Check whether the release already exists
      id: existing
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
      run: |
        if gh release view "${VERSION}" --repo "${REPO}" > /dev/null 2>&1; then
          echo "::notice::Release ${VERSION} already exists in ${REPO}; nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # The workflow token, not the App token: this reads the monorepo, not the target repo.
    - name: Collect release context
      id: context
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LIBRARY: ${{ inputs.library }}
        VERSION: ${{ inputs.version }}
      run: |
        # Prints 'previous-version=', 'is-newest=' and 'has-changes=' on stdout; progress on stderr.
        "${{ github.workspace }}/bin/release-context.sh" \
          "${LIBRARY}" \
          "${VERSION}" \
          "${{ github.workspace }}/.release/context.md" >> "$GITHUB_OUTPUT"

    # Nothing changed under libs/<lib>, so there is nothing to describe and the model is not asked.
    - name: Write release notes for a release without library changes
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        LIBRARY: ${{ inputs.library }}
      run: |
        printf '%s\n' \
          "No changes in \`libs/${LIBRARY}\` itself. Released to pick up changes in the libraries it depends on." \
          > "${NOTES_FILE}"

    # One completion, no agent: release-context.sh already gathered the pull request descriptions and
    # the diff, so the model needs no tools, no network and no repository access. That leaves nothing
    # for a prompt injection in a pull request body to reach.
    - name: Write release notes
      id: notes
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes == 'true'
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        MODEL: ${{ inputs.model }}
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        PROMPT_FILE: ${{ github.action_path }}/prompt.md
        CONTEXT_FILE: ${{ github.workspace }}/.release/context.md
        REQUEST_FILE: ${{ runner.temp }}/gemini-request.json
        RESPONSE_FILE: ${{ runner.temp }}/gemini-response.json
      run: |
        if [ -z "${GEMINI_API_KEY}" ]; then
          echo "::error::gemini-api-key is empty. Check the RELEASE_GENERATOR_GEMINI_API_KEY secret is readable by this repository."
          exit 1
        fi

        # jq builds the body so the prompt and the context are JSON-escaped rather than interpolated.
        jq -n --rawfile prompt "${PROMPT_FILE}" --rawfile context "${CONTEXT_FILE}" --arg model "${MODEL}" \
          '{model: $model, input: ($prompt + "\n\n" + $context)}' > "${REQUEST_FILE}"

        HTTP_STATUS="$(curl --silent --show-error \
          --output "${RESPONSE_FILE}" --write-out '%{http_code}' \
          --max-time 300 --retry 2 --retry-connrefused \
          -X POST 'https://generativelanguage.googleapis.com/v1beta2/interactions' \
          -H 'Content-Type: application/json' \
          -H "x-goog-api-key: ${GEMINI_API_KEY}" \
          --data-binary "@${RUNNER_TEMP}/gemini-request.json")"

        if [ "${HTTP_STATUS}" != "200" ]; then
          echo "::error::Gemini returned HTTP ${HTTP_STATUS}:"
          jq '.' "${RESPONSE_FILE}" 2>/dev/null || cat "${RESPONSE_FILE}"
          exit 1
        fi

        # The text lives on the model_output step; selected by type rather than by index so an extra
        # step in the response does not silently yield the wrong content.
        jq -r '[.steps[] | select(.type == "model_output") | .content[] | select(.type == "text")
          | .text] | join("\n")' "${RESPONSE_FILE}" > "${NOTES_FILE}"

        if [ ! -s "${NOTES_FILE}" ]; then
          echo "::error::Gemini returned no text. Response was:"
          jq '.' "${RESPONSE_FILE}" 2>/dev/null || cat "${RESPONSE_FILE}"
          exit 1
        fi

    # The compare link is appended here rather than by the model so it can never be wrong.
    - name: Finalize release notes
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_VERSION: ${{ steps.context.outputs.previous-version }}
      run: |
        # Keep the bullets only; a preamble about what the model checked must not reach the release.
        sed -i -n '/^- /,$p' "${NOTES_FILE}"

        if [ ! -s "${NOTES_FILE}" ]; then
          echo "::error::No release notes were written; refusing to create a release without them."
          exit 1
        fi
        if [ -n "${PREVIOUS_VERSION}" ]; then
          {
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_VERSION}...${VERSION}"
          } >> "${NOTES_FILE}"
        fi
        {
          echo "## Release notes for ${REPO} ${VERSION}"
          echo ""
          cat "${NOTES_FILE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create the release
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        IS_NEWEST: ${{ steps.context.outputs.is-newest }}
      run: |
        # --latest is always explicit. 'gh' only sends make_latest when the flag is given, and the
        # API defaults it to true, which would let a backfilled older version steal the Latest badge
        # from the real newest release.
        #
        # If --verify-tag ever fails claiming the tag is missing, suspect replication lag first.
        gh release create "${VERSION}" \
          --repo "${REPO}" \
          --title "${VERSION}" \
          --notes-file "${NOTES_FILE}" \
          --latest="${IS_NEWEST}" \
          --verify-tag
        echo "::notice::Created release ${VERSION} in ${REPO}."

    - name: Report the dry run
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run == 'true'
      shell: bash
      run: echo "::notice::Dry run — the notes are in the job summary, no release was created."
