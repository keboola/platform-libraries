name: Create release
description: Write release notes with Claude Code and create a GitHub release in the library's standalone repo

# Every credential is an input, never job-level env: a composite action substitutes inputs into the
# steps that name them instead of exporting them, so the App private key reaches the token step and
# nothing else. Job-level env would put it in the environment of every step, Claude Code's included.
inputs:
  library:
    description: Library directory name under libs/ (e.g. output-mapping)
    required: true
  version:
    description: Released version, without the library prefix (e.g. 27.10.0)
    required: true
  app-id:
    description: GitHub App ID used to mint a scoped installation token
    required: true
  private-key:
    description: GitHub App private key (PEM) used to mint a scoped installation token
    required: true
  anthropic-api-key:
    description: Anthropic API key Claude Code uses to write the release notes
    required: true
  dry-run:
    description: Print the notes to the job summary instead of creating the release
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The library -> standalone repo mapping lives in bin/target-repo.sh, shared with split-library.
    - name: Resolve target repository
      id: target
      shell: bash
      env:
        LIBRARY: ${{ inputs.library }}
      run: |
        # Assign first: an 'echo "repo=$(...)"' one-liner would swallow the script's exit code.
        REPO="$("${{ github.workspace }}/bin/target-repo.sh" "${LIBRARY}")"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: keboola
        repositories: ${{ steps.target.outputs.repo }}

    # Makes both callers re-runnable: a release that is already there is never rewritten.
    - name: Check whether the release already exists
      id: existing
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
      run: |
        if gh release view "${VERSION}" --repo "${REPO}" > /dev/null 2>&1; then
          echo "::notice::Release ${VERSION} already exists in ${REPO}; nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # GH_TOKEN is the workflow token here, not the App token: this reads the monorepo, not the target.
    - name: Collect release context
      id: context
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LIBRARY: ${{ inputs.library }}
        VERSION: ${{ inputs.version }}
      run: |
        # The script prints 'previous-version=', 'is-newest=' and 'has-changes=' on stdout, progress
        # on stderr.
        "${{ github.workspace }}/bin/release-context.sh" \
          "${LIBRARY}" \
          "${VERSION}" \
          "${{ github.workspace }}/.release/context.md" >> "$GITHUB_OUTPUT"

    # A library re-released only to pick up its '*@dev' siblings has nothing for the model to
    # describe. The body is fixed text derived from the empty commit list rather than whatever the
    # model would make of an empty context file.
    - name: Write release notes for a release without library changes
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        LIBRARY: ${{ inputs.library }}
      run: |
        printf '%s\n' \
          "No changes in \`libs/${LIBRARY}\` itself. Released to pick up changes in the libraries it depends on." \
          > "${NOTES_FILE}"

    # github_token is required, not optional: the action resolves a token either from this input or
    # from OIDC, and nothing else. Without it the step fails before the model runs. It must stay the
    # input rather than 'id-token: write' — the OIDC path exchanges for a Claude App token minted
    # with contents/pull-requests/issues write, while this keeps the model on the caller's
    # 'contents: read' + 'pull-requests: read'. The action also exports whatever it resolves as
    # GH_TOKEN for the model's own 'gh' calls, so setting that in 'env:' here has no effect.
    - name: Write release notes with Claude Code
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes == 'true'
      uses: anthropics/claude-code-action@v1
      with:
        github_token: ${{ github.token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        prompt: |
          ## Task

          Write the release notes for version ${{ inputs.version }} of the
          `${{ inputs.library }}` PHP library.

          Start by reading `${{ github.workspace }}/.release/context.md`. It lists the pull requests
          and the commits that went into this release.

          ### Where to look

          The pull request descriptions in the monorepo are the primary source — they explain what
          changed and why. For every pull request listed in the context file:

          - `gh pr view <number> --repo ${{ github.repository }} --json title,body --jq '.title, .body'`
          - `gh pr diff <number> --repo ${{ github.repository }}` when a description is thin, vague,
            or does not match the commit subjects
          - `Read`, `Grep` and `Glob` under `libs/${{ inputs.library }}` to confirm a name you are
            about to write

          Ignore the pull request template boilerplate — Justification, Plans for Customer
          Communication, Impact Analysis, Deployment Plan, Rollback Plan, Post-Release Support Plan.
          Only the technical description of the change matters.

          ### What to write

          The reader is a PHP developer who depends on this library and wants to know whether to
          upgrade and what they have to change.

          - Two to six markdown bullets, one per user-visible change. Fold every commit and pull
            request belonging to the same change into a single bullet.
          - Start a backward incompatible change with `⚠️` and say what a consumer has to do.
          - Name the classes, methods and configuration options a consumer touches, in backticks.
            Every name must come from the diff or the source — never invent or guess one.
          - Leave out internal churn: refactors with no observable effect, review fixups, test-only
            changes, coding standard and static analysis fixes.
          - If the release changes nothing but tests, documentation or CI, say exactly that in one
            bullet and write nothing else.
          - No heading, no preamble, no changelog link, no pull request or commit references — those
            are added around your text.

          Keep it terse and factual. Two bullets from earlier releases, for tone:

          - "Require `keboola/storage-api-php-client-branch-wrapper` `^7.0`. Test helpers now set
            `AuthType::STORAGE_TOKEN` on token-bearing `ClientOptions` (required by 7.0)."
          - "⚠️ The client-side load-type decider was removed (BC break). `LoadTypeDecider`,
            `WorkspaceLoadPlan` and `AbstractWorkspaceStrategy::prepareTableLoadsToWorkspace()` are
            gone. Use the two-phase `Reader::prepareAndExecuteTableLoads()` +
            `waitForTableLoadCompletion()` API instead."

          ### Output

          Write the bullets to `${{ github.workspace }}/.release/notes.md` with the Write tool. Do
          not create, change or comment on anything else.
        # Pull request bodies are attacker-influenced input, so nothing here may reach the network:
        # no 'gh api' (it takes arbitrary URLs), only the two read-only 'gh pr' subcommands the
        # prompt needs. The commit -> pull request lookup already happened in release-context.sh.
        claude_args: >-
          --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Grep,Glob,Write"

    # The compare link is appended here rather than by the model so it can never be wrong.
    - name: Finalize release notes
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_VERSION: ${{ steps.context.outputs.previous-version }}
      run: |
        if [ ! -s "${NOTES_FILE}" ]; then
          echo "::error::Claude Code wrote no release notes; refusing to create a release without them."
          exit 1
        fi
        if [ -n "${PREVIOUS_VERSION}" ]; then
          {
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_VERSION}...${VERSION}"
          } >> "${NOTES_FILE}"
        fi
        {
          echo "## Release notes for ${REPO} ${VERSION}"
          echo ""
          cat "${NOTES_FILE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create the release
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        IS_NEWEST: ${{ steps.context.outputs.is-newest }}
      run: |
        # --latest is always explicit. 'gh' only sends make_latest when the flag is given, and the
        # API defaults it to true, which would let a backfilled older version steal the Latest badge
        # from the real newest release.
        #
        # --verify-tag runs seconds after split-repo.sh pushed that tag. If this ever fails claiming
        # the tag does not exist, suspect replication lag on the target repo before anything else.
        gh release create "${VERSION}" \
          --repo "${REPO}" \
          --title "${VERSION}" \
          --notes-file "${NOTES_FILE}" \
          --latest="${IS_NEWEST}" \
          --verify-tag
        echo "::notice::Created release ${VERSION} in ${REPO}."

    - name: Report the dry run
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run == 'true'
      shell: bash
      run: echo "::notice::Dry run — the notes are in the job summary, no release was created."
