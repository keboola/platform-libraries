name: Split library
description: Split a library subdirectory from the monorepo and push to its standalone repo

# Credentials come from the environment, not from inputs: SPLIT_APP_ID and SPLIT_APP_PRIVATE_KEY
# must be set by the calling workflow (the secrets context is not available inside an action).
inputs:
  library:
    description: Library directory name under libs/ (e.g. key-generator)
    required: true

runs:
  using: composite
  steps:
    # The library -> standalone repo mapping lives in bin/target-repo.sh, shared with create-release.
    - name: Resolve target repository
      id: target
      shell: bash
      env:
        LIBRARY: ${{ inputs.library }}
      run: |
        # Assign first: an 'echo "repo=$(...)"' one-liner would swallow the script's exit code.
        REPO="$("${{ github.workspace }}/bin/target-repo.sh" "${LIBRARY}")"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ env.SPLIT_APP_ID }}
        private-key: ${{ env.SPLIT_APP_PRIVATE_KEY }}
        owner: keboola
        repositories: ${{ steps.target.outputs.repo }}

    - name: Install git-filter-repo
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git-filter-repo

    - name: Split and push
      shell: bash
      env:
        SPLIT_TOKEN: ${{ steps.app-token.outputs.token }}
        LIBRARY: ${{ inputs.library }}
      run: |
        TARGET_URL="https://x-access-token:${SPLIT_TOKEN}@github.com/keboola/${{ steps.target.outputs.repo }}.git"
        # Branch build -> push that branch; tag build -> push only that one (stripped) tag.
        PUSH_BRANCH=""
        PUSH_TAG=""
        if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
          PUSH_BRANCH="${GITHUB_REF_NAME}"
        else
          PUSH_TAG="${GITHUB_REF_NAME#"${LIBRARY}/"}"
        fi
        "${{ github.workspace }}/bin/split-repo.sh" \
          "${{ github.workspace }}" \
          "${TARGET_URL}" \
          "libs/${LIBRARY}" \
          "${LIBRARY}/" \
          "${PUSH_BRANCH}" \
          "${PUSH_TAG}"
