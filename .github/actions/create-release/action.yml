name: Create release
description: Write release notes with Claude Code and create a GitHub release in the library's standalone repo

# Every credential is an input, never job-level env: a composite action substitutes inputs into the
# steps that name them instead of exporting them, so the App private key reaches the token step and
# nothing else. Job-level env would put it in the environment of every step, Claude Code's included.
inputs:
  library:
    description: Library directory name under libs/ (e.g. output-mapping)
    required: true
  version:
    description: Released version, without the library prefix (e.g. 27.10.0)
    required: true
  app-id:
    description: GitHub App ID used to mint a scoped installation token
    required: true
  private-key:
    description: GitHub App private key (PEM) used to mint a scoped installation token
    required: true
  anthropic-api-key:
    description: Anthropic API key Claude Code uses to write the release notes
    required: true
  dry-run:
    description: Print the notes to the job summary instead of creating the release
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The library -> standalone repo mapping lives in bin/target-repo.sh, shared with split-library.
    - name: Resolve target repository
      id: target
      shell: bash
      env:
        LIBRARY: ${{ inputs.library }}
      run: |
        # Assign first: an 'echo "repo=$(...)"' one-liner would swallow the script's exit code.
        REPO="$("${{ github.workspace }}/bin/target-repo.sh" "${LIBRARY}")"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: keboola
        repositories: ${{ steps.target.outputs.repo }}

    # Makes both callers re-runnable: a release that is already there is never rewritten.
    - name: Check whether the release already exists
      id: existing
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
      run: |
        if gh release view "${VERSION}" --repo "${REPO}" > /dev/null 2>&1; then
          echo "::notice::Release ${VERSION} already exists in ${REPO}; nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # GH_TOKEN is the workflow token here, not the App token: this reads the monorepo, not the target.
    - name: Collect release context
      id: context
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LIBRARY: ${{ inputs.library }}
        VERSION: ${{ inputs.version }}
      run: |
        # The script prints 'previous-version=', 'is-newest=' and 'has-changes=' on stdout, progress
        # on stderr.
        "${{ github.workspace }}/bin/release-context.sh" \
          "${LIBRARY}" \
          "${VERSION}" \
          "${{ github.workspace }}/.release/context.md" >> "$GITHUB_OUTPUT"

    # A library re-released only to pick up its '*@dev' siblings has nothing for the model to
    # describe. The body is fixed text derived from the empty commit list rather than whatever the
    # model would make of an empty context file.
    - name: Write release notes for a release without library changes
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        LIBRARY: ${{ inputs.library }}
      run: |
        printf '%s\n' \
          "No changes in \`libs/${LIBRARY}\` itself. Released to pick up changes in the libraries it depends on." \
          > "${NOTES_FILE}"

    # Deliberately the Claude Code CLI and not anthropics/claude-code-action: that action rejects
    # this workflow outright ("Unsupported event type: push" — src/github/context.ts allows only the
    # issue/PR events plus workflow_dispatch, repository_dispatch, schedule and workflow_run), and a
    # tag push is a push event. Its PR-automation features are not wanted here either; this needs
    # one headless generation. --bare skips hooks, plugins and CLAUDE.md discovery and takes auth
    # strictly from ANTHROPIC_API_KEY, so the run does not depend on repository content.
    #
    # The notes are the process stdout, so the model needs no write access anywhere. Pull request
    # bodies are attacker-influenced input, so nothing in --allowed-tools may reach the network: no
    # 'gh api' (it takes arbitrary URLs), only the two read-only 'gh pr' subcommands the prompt
    # needs. The commit -> pull request lookup already happened in release-context.sh.
    - name: Write release notes with Claude Code
      id: notes
      if: steps.existing.outputs.skip != 'true' && steps.context.outputs.has-changes == 'true'
      shell: bash
      env:
        # Scoped to this one step: the key belongs in the model's process and nowhere else.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        # The workflow token, for the model's own 'gh pr' calls against the monorepo. Read-only.
        GH_TOKEN: ${{ github.token }}
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        PROMPT_FILE: ${{ github.action_path }}/prompt.md
      run: |
        # Pinned on purpose: release notes should not change wording because a CLI release landed
        # overnight. Bump deliberately.
        npm install -g @anthropic-ai/claude-code@2.1.246

        # The prompt goes in on stdin, not as an argument: --allowed-tools is variadic, so it eats
        # every following argument and the prompt disappears into the tool list ("Input must be
        # provided either through stdin or as a prompt argument").
        claude --print --bare \
          --model opus \
          --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Read,Grep,Glob" \
          < "${PROMPT_FILE}" > "${NOTES_FILE}"

    # The compare link is appended here rather than by the model so it can never be wrong.
    - name: Finalize release notes
      if: steps.existing.outputs.skip != 'true'
      shell: bash
      env:
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_VERSION: ${{ steps.context.outputs.previous-version }}
      run: |
        # The notes are bullets. Drop anything before the first one: the model occasionally opens
        # with a line about what it verified, which is fine to read in the log and wrong to publish.
        # If that leaves nothing, the emptiness check below fails the release rather than shipping it.
        sed -i -n '/^- /,$p' "${NOTES_FILE}"

        if [ ! -s "${NOTES_FILE}" ]; then
          echo "::error::Claude Code wrote no release notes; refusing to create a release without them."
          exit 1
        fi
        if [ -n "${PREVIOUS_VERSION}" ]; then
          {
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_VERSION}...${VERSION}"
          } >> "${NOTES_FILE}"
        fi
        {
          echo "## Release notes for ${REPO} ${VERSION}"
          echo ""
          cat "${NOTES_FILE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create the release
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        NOTES_FILE: ${{ github.workspace }}/.release/notes.md
        REPO: keboola/${{ steps.target.outputs.repo }}
        VERSION: ${{ inputs.version }}
        IS_NEWEST: ${{ steps.context.outputs.is-newest }}
      run: |
        # --latest is always explicit. 'gh' only sends make_latest when the flag is given, and the
        # API defaults it to true, which would let a backfilled older version steal the Latest badge
        # from the real newest release.
        #
        # --verify-tag runs seconds after split-repo.sh pushed that tag. If this ever fails claiming
        # the tag does not exist, suspect replication lag on the target repo before anything else.
        gh release create "${VERSION}" \
          --repo "${REPO}" \
          --title "${VERSION}" \
          --notes-file "${NOTES_FILE}" \
          --latest="${IS_NEWEST}" \
          --verify-tag
        echo "::notice::Created release ${VERSION} in ${REPO}."

    - name: Report the dry run
      if: steps.existing.outputs.skip != 'true' && inputs.dry-run == 'true'
      shell: bash
      run: echo "::notice::Dry run — the notes are in the job summary, no release was created."
